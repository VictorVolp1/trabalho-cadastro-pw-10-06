<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <!-- Logo-->
            <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold text-white" href="index.html">
                <img src="img/logo.png" alt="Logo" width="40" height="40" class="rounded shadow-sm">
                <span class="d-flex flex-column lh-1">
                    <span class="fw-bold text-white">Cadastro Ágil</span>
                    <small class="text-light opacity-75">Gestão rápida</small>
                </span>
            </a>
            <!-- Botão hambúrguer (mobile) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Menu -->
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="integrantes.html">Integrantes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="clientes.html">Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="vendedores.html">Vendedores</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h3>Clientes</h3>
        <div class="cadastro-grid mt-3">
            <label class="field-box">
                <span>Nome</span>
                <input id="nome" class="form-control" placeholder="Digite o nome">
            </label>
            <label class="field-box">
                <span>E-mail</span>
                <input id="email" class="form-control" placeholder="Digite o e-mail">
            </label>
            <label class="field-box">
                <span>Telefone</span>
                <input id="telefone" class="form-control" placeholder="Digite o telefone">
            </label>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-3">
            <button id="salvar" class="btn btn-primary">Salvar</button>
            <button id="cancelar" class="btn btn-secondary">Cancelar</button>
            <small id="status" class="text-muted align-self-center"></small>
        </div>
        <table class="table mt-3 table-bordered table-striped table-hover table-sm align-middle">
            <tbody id="lista"></tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/clientes.js"></script>
</body>

</html>
